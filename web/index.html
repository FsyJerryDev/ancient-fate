<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#eee7e6"><title>穿越古代，你能活到第几集？｜大曜命运档案</title><style>:root {

.site-footer span:last-child { font: 9px Georgia,serif; letter-spacing:1.5px; }
.initial-loading { height: 100vh; display:flex; align-items:center; justify-content:center; color: #7b638c; font-size:14px; letter-spacing:3px; }
.enter { animation: showUp .43s ease both; }
@keyframes showUp { from { opacity:0; transform:translateY(10px); } to {opacity:1; transform:translateY(0);} }
.ornament-frame { position: relative; overflow: hidden; }
.ornament-frame::before, .ornament-frame::after { content:""; position:absolute; width:35px; height:35px; border-color:#c6ad9d; border-style:solid; pointer-events:none; }

.primary-button { width:100%; display:flex; align-items:center; justify-content:center; gap:12px; min-height:62px; border: 1px solid #756082; border-radius: 14px; background: linear-gradient(115deg,#695476,#866b97 68%,#746082); color:white; font-size:16px; font-weight:700; letter-spacing:1px; box-shadow:0 14px 27px rgba(94,75,108,.2); transition:transform .18s,box-shadow .18s; }

/* Welcome */

/* Chapter */
.chapter-view { min-height:660px; display:flex; flex-direction:column; align-items:center; text-align:center; padding:30px 38px 54px; background:radial-gradient(circle at 50% 22%,#fffefa,#fbf6f3 60%,#f7f0ef 100%); border:1px solid #e9dbdb; border-radius:24px; box-shadow:var(--shadow); position:relative; overflow:hidden; }

/* App-native confirmation: avoids window.confirm, which can be blocked in previews. */

.restart-dialog-kicker { color:#9b8099; font-size:10px; letter-spacing:3px; }
.restart-dialog h2 { margin:17px 0 12px; color:#4c3a51; font:700 26px/1.4 "STSong","Songti SC",serif; }
.restart-dialog p { color:#877585; font-size:13px; line-height:1.85; margin:0 0 25px; }
.restart-dialog-actions { display:flex; gap:10px; }
.restart-dialog-actions button { flex:1; min-width:0; padding:11px 6px; min-height:53px; font-size:13px; white-space:normal; line-height:1.4; }
@media (max-width:400px) { .restart-dialog { padding:26px 17px 18px; } .restart-dialog-actions { gap:8px; } .restart-dialog-actions button { font-size:12px; } }


/* 选择后的剧情反馈：居中弹窗、加大字号、3～5秒阅读进度条。 */
.question-instruction { font-size:12px; color:#aea1ad; margin:20px 0 0; text-align:center; line-height:1.8; }
.feedback-overlay { position:fixed; z-index:950; inset:0; background:rgba(31,23,38,.62); display:flex; align-items:center; justify-content:center; padding:22px; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
.feedback-dialog { width:min(100%,480px); background:linear-gradient(150deg,#fffefd,#f6edf5); padding:36px 32px 29px; border-radius:23px; border:1px solid #e7d5e6; box-shadow:0 25px 75px rgba(25,18,32,.34); text-align:center; animation:showUp .3s ease both; }
.feedback-seal { margin:0 auto 16px; width:56px; height:56px; border-radius:50%; background:#eee2ed; color:#866c98; border:1px solid #d2bad3; display:flex; align-items:center; justify-content:center; font-size:28px; }
.feedback-kicker { margin:0 0 18px; font-size:12px; letter-spacing:4px; font-weight:700; color:#8d6a91; }
.feedback-text { font-size:18px; font-weight:550; line-height:1.95; color:#46364c; margin:0 0 30px; text-align:center; }
.feedback-countdown { width:100%; height:5px; background:#e7dbe9; border-radius:999px; overflow:hidden; }
.feedback-countdown > span { display:block; width:100%; height:100%; background:linear-gradient(90deg,#bb91ab,#79628c); transform-origin:left center; animation:feedback-drain 4s linear both; }
@keyframes feedback-drain { from{transform:scaleX(1)} to{transform:scaleX(0)} }

@media (max-width:590px) { .feedback-dialog {padding:30px 22px 26px;} .feedback-text{font-size:17px;} }

/* 完整剧集的命运进度，和16题问卷进度明确区分。 */
.fate-progress { text-align:left; background:#f7f0f7; padding:15px 18px 14px; border:1px solid #e7d8e8; border-radius:14px; margin:19px 0 22px; }
.fate-progress-heading { display:flex; justify-content:space-between; align-items:baseline; gap:7px; font-size:12px; color:#8d768a; }
.fate-progress-heading strong {font-size:14px; color:#775984; white-space:nowrap; }
.fate-progress-heading em {font-style:normal; font-size:12px; font-weight:600; color:#a28b9c;}
.fate-progress-track {height:10px; background:#e6dbe8; border-radius:999px; overflow:hidden; margin:12px 0 7px;}
.fate-progress-track > span {display:block; height:100%; background:linear-gradient(90deg,#ae87ab,#79628c); border-radius:inherit;}
.fate-progress-labels {display:flex; justify-content:space-between; font-size:10px; color:#9c8b9d;}
@media (max-width:410px) {.fate-progress {padding:13px 12px;} .fate-progress-heading strong{font-size:12px;} .fate-progress-heading em{font-size:11px;} }

/* 兑换码及档案管理界面，复用 V3 原有宫廷风格 */
.redeem-form { width:100%; max-width:460px; margin:16px auto 24px; text-align:left; position:relative; z-index:2; }
.redeem-form label { display:block; font-weight:700; margin-bottom:12px; color:#5b476b; }
.redeem-form { min-width:0; max-width:100%; align-self:stretch; }
.redeem-form input,.redeem-form textarea { display:block; width:100%; max-width:100%; min-width:0; border:2px solid #bca2c0; outline:none; border-radius:14px; padding:12px 14px; font-size:16px; line-height:1.55; background:#fff; color:#4e3b55; letter-spacing:0; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
.redeem-form input { min-height:60px; }
.redeem-form textarea { min-height:83px; resize:none; white-space:pre-wrap; overflow-wrap:anywhere; word-break:break-word; overflow-x:hidden; overflow-y:auto; -webkit-text-size-adjust:100%; }
.redeem-form input:focus,.redeem-form textarea:focus { border-color:#755a93; box-shadow:0 0 0 4px #e8e0f0; }
.redeem-row { display:flex; gap:10px; margin-top:14px; }
.redeem-row .primary-button { min-height:54px; }
.setup-note,.ui-error { background:#fff2e5; border:1px solid #e2b996; color:#9b5225; border-radius:12px; padding:13px 18px; line-height:1.8; font-size:13px; }
.ui-error { max-width:640px; margin:0 auto 15px; position:fixed; z-index:10000; bottom:18px; left:15px; right:15px; box-shadow:0 12px 30px #0002; }
.dashboard-view { margin:auto; max-width:660px; }
.dashboard-head { text-align:center; border:1px solid #eadce1; border-radius:24px; background:#fffefa; padding:48px 26px; margin-bottom:18px; }
.dashboard-head h1 { font: bold 35px "STSong","Songti SC",serif; color:#614668; margin:12px 0; }
.dashboard-head p { color:#766577; }
.dashboard-head p strong { font-size:28px; color:#7b5e91; }
.dashboard-view>h2 { font-size:18px; color:#574765; margin-top:34px; }
.dashboard-hint,.empty-history { text-align:center; color:#94869b; line-height:1.8; font-size:13px; }
.history-item { padding:19px 18px; border:1px solid #e7dce7; border-radius:15px; margin:10px 0; display:flex; justify-content:space-between; align-items:center; gap:12px; background:#fffdfb; }
.history-item span { font-size:13px; color:#67566d; }
.history-item .secondary-button { white-space:nowrap; }
@media(max-width:510px) { .redeem-row { flex-direction:column; } .history-item { flex-direction:column; align-items:stretch; } .history-item button{width:100%;} }

/* Small-screen fit: text wraps within cards instead of stretching the viewport. */
@media (max-width:590px) {
  html,body { max-width:100%; overflow-x:hidden; overflow-x:clip; }
  .chapter-view > * { min-width:0; max-width:100%; }
  .redeem-form { width:100%; min-width:0; }
  .redeem-row { min-width:0; width:100%; }
  .redeem-row .primary-button,.redeem-row .secondary-button { min-width:0; max-width:100%; }
  .redeem-form textarea { font-size:16px; }
  #root,.app-shell,.app-header,main,.site-footer,
  .home-view,.chapter-view,.quiz-view,.preview-view,.report-view,
  .dashboard-view,.quiz-card,.choice-list,.report-section,.preview-card,
  .result-hero,.feedback-dialog,.history-item { min-width:0; max-width:100%; }
  main { width:100%; padding:16px 12px 45px; }
  .app-header { padding:0 12px; gap:8px; }
  .header-brand { min-width:0; flex:1 1 auto; gap:7px; }
  .header-brand > div { min-width:0; }
  .header-brand strong { font-size:clamp(10px,3.2vw,12px); letter-spacing:.3px; line-height:1.35; overflow-wrap:anywhere; }
  .header-brand small { letter-spacing:.15px; }
  .header-link { flex:none; max-width:33vw; white-space:normal; text-align:right; line-height:1.35; padding-left:3px; }
  .home-hero { padding-left:16px; padding-right:16px; }
  .home-hero h1 { font-size:clamp(27px,8.5vw,40px); letter-spacing:1px; }
  .intro-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .feature-tile { min-width:0; padding:16px 11px; }
  .chapter-view { padding-left:17px; padding-right:17px; }
  .chapter-view h1 { font-size:clamp(25px,7vw,29px); }
  .quiz-card { padding-left:16px; padding-right:16px; }
  .progress-top { gap:8px; }
  .progress-top > span { min-width:0; }
  .choice-button { min-width:0; width:100%; }
  .choice-text { min-width:0; flex:1 1 0; }
  .choice-arrow { flex:none; }
  .preview-card { padding-left:15px; padding-right:15px; }
  .preview-locked,.preview-locked > div { min-width:0; }
  .preview-episode,.result-episode { font-size:clamp(19px,5.5vw,30px); }
  .preview-episode strong,.result-episode strong { font-size:clamp(52px,19vw,86px); }
  .result-hero { padding-left:16px; padding-right:16px; }
  .result-hero h1 { font-size:clamp(28px,7.8vw,39px); letter-spacing:1px; }
  .report-section { padding-left:16px; padding-right:16px; }
  .report-top,.fate-progress-heading { flex-wrap:wrap; gap:8px; }
  .fate-progress-heading strong { white-space:normal; }
  .fate-progress-labels { gap:8px; }
  .recall-item,.recall-item > div,.quote-list blockquote { min-width:0; }
  .chapter-description,.chapter-recap,.question-context,.choice-text,.feedback-text,
  .story-paragraphs,.story-paragraphs p,.report-section p,.report-section blockquote,
  .history-item span,.dashboard-head,.home-sub,.hero-note,.preview-locked,
  .fate-progress-heading,.ui-error { overflow-wrap:anywhere; word-break:break-word; }
  .toast { white-space:normal; overflow-wrap:anywhere; text-align:center; }
}
@media (max-width:360px) {
  .home-hero { padding-left:12px; padding-right:12px; }
  .intro-grid { grid-template-columns:minmax(0,1fr); }
  .chapter-view { padding-left:12px; padding-right:12px; }
  .chapter-topline { letter-spacing:2px; }
  .quiz-card { padding-left:12px; padding-right:12px; }
  .choice-button { padding:13px 10px; gap:8px; }
  .preview-locked { padding:14px 12px; gap:8px; }
  .report-section,.result-hero { padding-left:12px; padding-right:12px; }
  .score-header { flex-wrap:wrap; gap:5px; }
}
/* Poster preview on phones: keep the PNG within the page. */

.poster-header { display:flex; justify-content:space-between; align-items:center; gap:10px; }
