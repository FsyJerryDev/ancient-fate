<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>大曜 · 兑换码管理</title><style>body{margin:0;background:#f2edf2;color:#4c3b59;font:16px/1.7 system-ui,sans-serif}.panel{max-width:720px;margin:5vh auto;background:#fff;border:1px solid #ded0e2;border-radius:20px;padding:clamp(20px,5vw,42px)}h1{font-size:25px}label{display:block;margin-top:15px;font-weight:600}input{width:100%;border:1px solid #c6b6d3;border-radius:10px;padding:14px;font:inherit;box-sizing:border-box}button{background:#765c90;color:white;border:0;border-radius:10px;padding:13px 20px;font:inherit;cursor:pointer;margin:15px 8px 0 0}button:disabled{opacity:.5}pre{white-space:pre-wrap;word-break:break-word;background:#f8f3fc;padding:16px;border-radius:10px}p{color:#776983}.error{color:#aa3232}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.row input{max-width:120px}table{border-collapse:collapse;width:100%;font-size:12px}td,th{border-bottom:1px solid #eee;padding:8px;text-align:left}section{margin-top:20px}</style></head><body><main class="panel"><h1>大曜 · 兑换码管理</h1><p>管理员需先在 Supabase Auth 创建账号，并在 public.admin_users 白名单中添加用户 ID。登录后方可生成兑换码。</p><section id="login"><label for="email">管理员邮箱</label><input type="email" id="email" autocomplete="username"><label for="password">登录密码</label><input type="password" id="password" autocomplete="current-password"><button id="signin">登录</button></section><section id="workspace" hidden><h2>批量生成兑换码</h2><div class="row"><label for="quantity">数量（1～200）</label><input id="quantity" type="number" value="10" min="1" max="200"><button id="issue">生成并下载 CSV</button><button id="list">查看最近100个兑换码状态</button></div><p>生成的明文兑换码只在这次操作返回。请立即安全保存 CSV，再通过小红书获准的交付方式发送。数据库不会保存明文码。</p><pre id="issued"></pre><div id="rows"></div><h2>订单关联与冻结</h2><p>选择“查看最近 100 个兑换码状态”获得对应 ID。这里只能使用已确认的真实订单号。</p><label for="manage-id">兑换码记录 ID（不是明文兑换码）</label><input id="manage-id" placeholder="从列表复制 UUID"/><label for="order-ref">小红书订单号（绑定时填写）</label><input id="order-ref" placeholder="可选的真实订单号"/><div><button id="bind">绑定订单</button><button id="freeze">冻结此兑换码</button><button id="unfreeze">解除冻结</button></div></section><p class="error" id="error" role="alert"></p><a href="./tokyo-test.html">返回测评首页</a></main><script src="./tokyo-config.js"></script><script src="./admin.js"></script></body></html>
