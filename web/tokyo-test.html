<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#eee7e6"><title>穿越古代，你能活到第几集？｜大曜命运档案</title><style>:root {

.site-footer span:last-child { font: 9px Georgia,serif; letter-spacing:1.5px; }
.initial-loading { height: 100vh; display:flex; align-items:center; justify-content:center; color: #7b638c; font-size:14px; letter-spacing:3px; }
.enter { animation: showUp .43s ease both; }
@keyframes showUp { from { opacity:0; transform:translateY(10px); } to {opacity:1; transform:translateY(0);} }
.ornament-frame { position: relative; overflow: hidden; }
.ornament-frame::before, .ornament-frame::after { content:""; position:absolute; width:35px; height:35px; border-color:#c6ad9d; border-style:solid; pointer-events:none; }

.primary-button { width:100%; display:flex; align-items:center; justify-content:center; gap:12px; min-height:62px; border: 1px solid #756082; border-radius: 14px; background: linear-gradient(115deg,#695476,#866b97 68%,#746082); color:white; font-size:16px; font-weight:700; letter-spacing:1px; box-shadow:0 14px 27px rgba(94,75,108,.2); transition:transform .18s,box-shadow .18s; }

/* Welcome */

/* Chapter */
.chapter-view { min-height:660px; display:flex; flex-direction:column; align-items:center; text-align:center; padding:30px 38px 54px; background:radial-gradient(circle at 50% 22%,#fffefa,#fbf6f3 60%,#f7f0ef 100%); border:1px solid #e9dbdb; border-radius:24px; box-shadow:var(--shadow); position:relative; overflow:hidden; }

/* App-native confirmation: avoids window.confirm, which can be blocked in previews. */

/* 选择后的剧情反馈：居中弹窗、加大字号、3～5秒阅读进度条。 */

@media (max-width:590px) { .feedback-dialog {padding:30px 22px 26px;} .feedback-text{font-size:17px;} }

}

.poster-original-link{display:block;text-align:center;padding:12px;border-radius:10px;background:#775e8b;color:#fff;text-decoration:none;font-size:14px;font-weight:700}.poster-original-link:visited{color:#fff}</style></head><body><div data-dayao-tokyo-test style="position:relative;z-index:10000;text-align:center;background:#5e4677;color:white;padding:8px 16px;font-size:13px">东京 Supabase 测试环境 · 当前页面不会影响正式网站</div><div id="root"></div><script id="game-data" type="application/json">{"chapters":[{"id":1,"eyebrow":"CHAPTER I · 命运起笔","title":"一封不该出现的密信","episodes":"第 1—2 集","description":"你从梦中醒来，已是大曜王朝的一名年轻记录官。上任第一天，你便接手赈灾粮款文书。三页突然缺失的记录，正悄悄将你卷入一场风暴。","hook":"第一步棋，往往决定你会被谁看见。","glyph":"壹"},{"id":2,"eyebrow":"CHAPTER II · 风起粮仓","title":"消失的三千石赈粮","episodes":"第 3—4 集","description":"粮仓外，饥饿的百姓与守卫僵持。一批登记在册的赈粮离奇消失，而你手中的蛛丝马迹，开始指向朝中之人。","hook":"有人要你闭嘴，有人盼你开口。","glyph":"贰"},{"id":3,"eyebrow":"CHAPTER III · 宫宴如棋","title":"所有人都在说谎","episodes":"第 5—6 集","description":"一封突如其来的夜宴请帖将你带进深宫。歌舞升平之下，每一双眼睛都在审视你。失踪的证人，或许就在今夜出现。","hook":"棋局深处，真话有时比谎言更危险。","glyph":"叁"},{"id":4,"eyebrow":"CHAPTER IV · 朝堂终局","title":"最后一场朝堂对决","episodes":"第 7—8 集","description":"赈粮案即将公开审理，你终于获得了陈述真相的机会。八集以来的每一次抉择，都将在殿前迎来回响。","hook":"你会如何落下最后一子？","glyph":"肆"}],"chapterOutros":{"1":"你已走过最初两集。但那封密信的主人，似乎比你想象中更了解这座宫城。","2":"第 4 集结束。粮仓的迷雾未散，一封深宫夜宴的邀请却已送到你的案头。","3":"第 6 集结束。你终于知道，不是所有敌人都站在明处，也不是所有朋友都会开口。"},"questions":[{"id":1,"chapter":1,"episode":1,"title":"缺失的三页","context":"一册赈粮记录缺了三页。你刚刚入职，谁也不愿多说一句。","key":false,"choices":[{"id":"A","text":"先对照目录和其他文书，确定缺失内容。","feedback":"你发现目录页的笔迹与正文不同。有人比你更早动过这本账册。"},{"id":"B","text":"找熟悉内务的老书吏，询问其中缘由。","feedback":"老书吏沉默片刻，提醒你晚上别独自去文书房。"},{"id":"C","text":"主动申请进入封存库房，寻找原始记录。","feedback":"库房的封条完好，锁眼却有一道新鲜划痕。"},{"id":"D","text":"先保证当天应处理的公务不会因此延误。","feedback":"你稳住了手头差事，也让焦躁的同僚松了口气。"}]},{"id":2,"chapter":1,"episode":1,"title":"无端的责罚","context":"另一名年轻记录官被上司指责弄丢公文，而你知道事实另有隐情。","key":false,"choices":[{"id":"A","text":"整理当天交接记录，找出真实责任归属。","feedback":"一张交接单帮同僚洗清了部分嫌疑。"},{"id":"B","text":"私下沟通双方，让误会得到澄清。","feedback":"上司的语气软了下来，同僚向你投来感激的一眼。"},{"id":"C","text":"当场说明自己看到的情况，为他辩解。","feedback":"你的声音传遍书房，所有人都记住了你的名字。"},{"id":"D","text":"主动替他完成积压公务，避免进一步受罚。","feedback":"你接过那叠沉重的卷宗，赢得了一份沉默的信任。"}]},{"id":3,"chapter":1,"episode":2,"title":"改动的日期","context":"运粮日期与朝廷公告相差整整七天。上司说只是笔误。","key":false,"choices":[{"id":"A","text":"按时间梳理运输过程，寻找矛盾。","feedback":"两次运输记录竟共用了同一枚驿站印章。"},{"id":"B","text":"向接触过粮车的人打听实际情况。","feedback":"一个马夫告诉你，确实有车队在深夜出城。"},{"id":"C","text":"直接找负责运输的官员询问。","feedback":"那位官员神色骤变，反问你是谁派来的。"},{"id":"D","text":"提醒有关人员重新核对，避免粮食发放出错。","feedback":"你留下了谨慎的书面记录，也暂时稳住了局面。"}]},{"id":4,"chapter":1,"episode":2,"title":"密信风波","context":"夜里，一封写着你名字的密信出现在案上。它可能藏着赈粮秘密，也可能是个陷阱。","key":true,"choices":[{"id":"A","text":"仔细检查印章、笔迹与来源。","feedback":"你在纸角发现特殊印记。它或许能成为日后的重要证据。"},{"id":"B","text":"找一位信得过的老书吏秘密求证。","feedback":"老书吏答应帮你查，他的支持将来可能派上用场。"},{"id":"C","text":"带着密信直接追问最可疑的人。","feedback":"你从对方的慌乱中抓住线索，但你的行动也暴露在众人眼中。"},{"id":"D","text":"先保护被密信牵连的年轻同僚。","feedback":"同僚记下你的恩情，只是暗处的敌人也发现了你的软肋。"}]},{"id":5,"chapter":2,"episode":3,"title":"粮仓前的争执","context":"粮仓大门紧闭，灾民与守卫发生争执，哭声和斥责声混在一起。","key":false,"choices":[{"id":"A","text":"核对发放名单与粮食数量，查明问题。","feedback":"发放清册中有一笔数目无法对应实际库存。"},{"id":"B","text":"向百姓解释情况，尽量缓和现场情绪。","feedback":"骚动暂歇，几位百姓愿意告诉你他们看到的事。"},{"id":"C","text":"请求守卫打开安全通道，先疏散人群。","feedback":"秩序逐渐恢复，你也赢得了守卫队长的注意。"},{"id":"D","text":"优先安置老人、孩子和身体虚弱的人。","feedback":"一位老人握着你的手，反复道谢。"}]},{"id":6,"chapter":2,"episode":3,"title":"来自上司的暗示","context":"你准备上报粮食异常，上司却暗示你别多管闲事。","key":false,"choices":[{"id":"A","text":"补足证据，确保举报内容经得起调查。","feedback":"你把账页、日期和印记重新整理成了一份证据清单。"},{"id":"B","text":"找可信赖的同僚，听听他们的判断。","feedback":"同僚低声告诉你，上司最近常与陌生官员来往。"},{"id":"C","text":"坚持向更高一级的官员直接呈报。","feedback":"呈报已经递出，接下来你必须承受它带来的目光。"},{"id":"D","text":"表示愿意承担上报可能带来的责任。","feedback":"有人劝你别这么傻，但你没有收回自己的名字。"}]},{"id":7,"chapter":2,"episode":4,"title":"消失的粮车","context":"一辆关键粮车临时改道，未留下任何合理说明。","key":false,"choices":[{"id":"A","text":"对照地图和运单，推断可能的去向。","feedback":"你圈出三条路线，其中一条经过废弃的旧仓。"},{"id":"B","text":"联系沿途驿站，托熟人留意消息。","feedback":"傍晚，一名驿卒悄悄递来一份车马登记。"},{"id":"C","text":"立即派人追查粮车下落。","feedback":"追查队伍赶在天黑前找到了一处可疑车辙。"},{"id":"D","text":"先保证剩余粮食正常供给灾民。","feedback":"被打乱的发粮秩序重新运转，百姓终于等来了口粮。"}]},{"id":8,"chapter":2,"episode":4,"title":"天亮之前","context":"三千石赈粮去向不明，转运官员要求你天亮前给出交代。","key":true,"choices":[{"id":"A","text":"连夜进入库房，核对粮仓账册。","feedback":"你找到一份被遗漏的账目，但也错过了与其他人交涉的机会。"},{"id":"B","text":"请可信的同僚分头查访，扩大线索来源。","feedback":"你的伙伴送来证词，不过更多人知道了你在追查此案。"},{"id":"C","text":"请求守卫封存相关粮仓，阻止记录转移。","feedback":"粮仓被及时封锁，虽然招来阻力，重要的物证却保住了。"},{"id":"D","text":"组织剩余粮食救济百姓，争取他们的信任。","feedback":"灾民的安危暂时有了保障，一位关键知情人愿意帮你。"}]},{"id":9,"chapter":3,"episode":5,"title":"夜宴请帖","context":"夜宴的邀请来得突然，落款上却是你未曾见过的私人印章。","key":false,"choices":[{"id":"A","text":"查明送帖人，推断宴会真正目的。","feedback":"你发现请帖上的纹饰属于一位极少露面的重臣。"},{"id":"B","text":"找熟识的官员一同赴宴，相互照应。","feedback":"有人答应同行，也提醒你席间要小心别人的试探。"},{"id":"C","text":"独自赴宴，亲自试探邀请者。","feedback":"你推门入席，宴中数道目光不约而同落在身上。"},{"id":"D","text":"先安排可能被牵连的同伴留在安全处。","feedback":"同伴被妥善安置，你独自承担更多未知。"}]},{"id":10,"chapter":3,"episode":5,"title":"席上的指控","context":"酒过三巡，有人当众暗示你收受贿赂。","key":false,"choices":[{"id":"A","text":"要求对方提供礼单与相应证据。","feedback":"对方迟迟拿不出礼单，席间响起了细微议论。"},{"id":"B","text":"请在场知情者协助澄清。","feedback":"一位官员站起身来，为你补上关键的说明。"},{"id":"C","text":"当场反驳，要求对方说清指控依据。","feedback":"厅堂寂静下来，对方的笑容僵在脸上。"},{"id":"D","text":"先避免无辜同僚被牵连，再处理自己。","feedback":"同僚被你从风波中隔开，却有人借机说你心虚。"}]},{"id":11,"chapter":3,"episode":6,"title":"沉默的证人","context":"你找到一名知情小吏，但他害怕得几乎说不出话。","key":false,"choices":[{"id":"A","text":"帮他梳理证词，明确哪些能够证实。","feedback":"零碎的话语终于拼凑出一条完整的时间线。"},{"id":"B","text":"慢慢建立信任，让他愿意开口。","feedback":"那人终于放下戒备，告诉你自己并非孤身一人。"},{"id":"C","text":"表示愿意出面揭露真相。","feedback":"他被你的勇气打动，声音渐渐不再发抖。"},{"id":"D","text":"先确保他与家人的安全。","feedback":"他长叹一口气，终于愿意让你知道自己所见。"}]},{"id":12,"chapter":3,"episode":6,"title":"夜宴惊变","context":"有人拿出伪造账册，试图将失粮案推到你的部门。证人被人拦在屏风之后。","key":true,"choices":[{"id":"A","text":"暗中留下印信拓样，为后续调查保留凭据。","feedback":"你获取关键印记，并发现它与旧账册上的痕迹相呼应。"},{"id":"B","text":"在宾客间私下沟通，希望更多人讲出实情。","feedback":"有几位宾客表示愿意帮忙，但他们仍需要你给出说服力。"},{"id":"C","text":"当众指出伪证中的矛盾，迫使对方回应。","feedback":"你冒险揭穿一处笔误，伪证的可信度当场动摇。"},{"id":"D","text":"护送证人离开危险现场。","feedback":"证人得以脱身，但当夜的指控一时无人正面回应。"}]},{"id":13,"chapter":4,"episode":7,"title":"证人将被调走","context":"朝审前，幕后之人准备悄悄调走几名关键证人。","key":false,"choices":[{"id":"A","text":"判断哪些证词最重要，先整理证据。","feedback":"你把证人的说法与物证逐一对应，找到能够相互验证的部分。"},{"id":"B","text":"联系可信赖的官员，寻求联合支持。","feedback":"几位官员愿意出面，即使这意味着他们也会遭到质问。"},{"id":"C","text":"派人阻止证人被强行带离。","feedback":"夜路被及时截住，证人终于有机会等到天亮。"},{"id":"D","text":"替证人安排安全去处。","feedback":"证人得以安睡一夜，而你也多了一份沉甸甸的承诺。"}]},{"id":14,"chapter":4,"episode":7,"title":"替罪的请求","context":"一名同僚表示愿意独自承担全部责任，希望其他人不再受牵连。","key":false,"choices":[{"id":"A","text":"核对各方供词，查明真正责任。","feedback":"你发现这个看似完美的认罪说法里有一处时间漏洞。"},{"id":"B","text":"劝说知情者共同出面讲清事实。","feedback":"更多人终于决定不再沉默。"},{"id":"C","text":"公开反对让一个人承担所有过错。","feedback":"你的反对令满堂惊愕，也为同僚争取了辩解的机会。"},{"id":"D","text":"告诉同僚，你愿意与他一起面对后果。","feedback":"他望向你，终于不再把所有责任揽到自己身上。"}]},{"id":15,"chapter":4,"episode":8,"title":"最后的劝退","context":"朝审前夜，一位神秘官员劝你就此退下，称继续追查只会招来灾祸。","key":false,"choices":[{"id":"A","text":"最后检查一遍证据，确认自己的判断。","feedback":"你从头读完了全部记录，发现许多看似偶然的细节彼此呼应。"},{"id":"B","text":"找到支持自己的官员，统一行动。","feedback":"几盏书房的灯亮到天明，你不再独自站在风里。"},{"id":"C","text":"坚持出庭，即使可能遭到针对。","feedback":"你把官服整齐叠好，决定明早直面所有人的目光。"},{"id":"D","text":"提前安排好证人与同伴的退路。","feedback":"你留下一封信：无论明天发生什么，都不要让无辜者再受牵连。"}]},{"id":16,"chapter":4,"episode":8,"title":"殿前定局","context":"钟声响起，皇帝命你解释赈粮案的一切异常。你必须决定最后的行动。","key":true,"choices":[{"id":"A","text":"将收集到的账册、印信与记录呈堂。","feedback":"你双手举起账册。所有目光都落在那几页薄纸上。"},{"id":"B","text":"邀请愿作证的官员和同伴共同陈词。","feedback":"你回头看去，席间有人缓缓站起。"},{"id":"C","text":"直接质询幕后之人，揭穿其自相矛盾之处。","feedback":"你抬头迎上对方的目光，殿内鸦雀无声。"},{"id":"D","text":"以自己的名义为证人与无辜同僚作保。","feedback":"你向前一步，把自己的姓名写进了这场风波。"}]}],"endings":[{"id":"strategy_early","role":"strategy","tier":"early","episode":12,"name":"纸上谋臣","title":"聪明人的第一场败局","coverQuote":"算对了所有人的心思，却没算到自己的处境。","story":["第十二集，你把最后一份推断递进朝堂。每一个数字都有依据，每一个时间都能对上，可是你的证据始终少了决定性的那一页。","掌权者没有当场发难，只是轻飘飘地调你离开了京城。后来，边城流传着一位善于破案的书吏，替不少普通人洗清了冤屈。","你没能成为朝堂中的传奇，却没有浪费看清世界的天分。"],"strengths":"观察敏锐、思路细密；遇到问题习惯先寻找证据而非急于表态。","shadow":"容易相信只要道理足够严密，事情就一定能够如愿推进。","counsel":"推理之外，别忘了人、时机和执行。有时候先争取一位帮手，比再找一条证据更重要。","quotes":["棋差一着，未必全盘皆输。","我记得所有细节，只是忘了谁在执棋。","离开朝堂，也能写出自己的史书。"]},{"id":"strategy_middle","role":"strategy","tier":"middle","episode":38,"name":"退隐军师","title":"看懂棋局的人，终于选择离席","coverQuote":"真正的聪明，是知道何时该离开棋盘。","story":["第三十八集，朝堂已知你能谋善断，许多人想把你请入自己的阵营。","你却在最热闹的一次宴席后递上辞呈。粮案真相终于显露，但权力游戏没有尽头；你不想把余生都用来预判他人的背叛。","数年后，有人循着江南的旧路找到你，只看见院中棋盘一副、春茶两盏。你不再为谁布局，却终于能为自己决定明天。"],"strengths":"清醒、克制、能从复杂局势中辨认长期代价。","shadow":"分析太多可能拖慢决定，也可能让自己与真实感受渐行渐远。","counsel":"真正的掌控不是预知所有结果，而是接受某些未知仍然值得尝试。","quotes":["这局棋，我不下了。","天下如局，而我自有归途。","退一步不是认输，是换一种赢法。"]},{"id":"strategy_legend","role":"strategy","tier":"legend","episode":88,"name":"幕后执棋者","title":"第八十八集，棋局终于落定","coverQuote":"人人都以为你是棋子，直到最后才发现棋盘是你摆的。","story":["第八十八集，宫门外大雪纷飞。曾经无人相信的小记录官，已成为朝中最懂得如何让事实开口的人。","你把粮案中相互呼应的账册和证词一一呈上，没有激烈言辞，却让重重谎言失去了支点。那些曾试图利用你的人终于明白：你从没急着赢下一城一池，而是在积攒改变局面的力量。","你没有坐上最高的位置，但数年之后，朝廷一项项新政背后，都能看见你留下的笔迹。"],"strengths":"洞察、耐心、全局意识，你愿意花时间理解问题真正的结构。","shadow":"过度谋划有时会让朋友觉得你遥远，也会错过不需要计算的真诚。","counsel":"偶尔把棋盘交给别人，信任同伴的即兴发挥。","quotes":["落子无声，山河有应。","我不争一时，只看终局。","人人都是棋子，也都能成为执棋者。"]},{"id":"social_early","role":"social","tier":"early","episode":11,"name":"错信之人","title":"你把信任交给了错误的人","coverQuote":"你愿意相信所有人，可惜并非所有人都值得相信。","story":["第十一集，你以为自己终于找到了能并肩作战的朋友，于是将最后一条线索交到对方手中。","次日，密信不翼而飞，你成了替罪的人。幸而曾被你真心帮助过的小吏出面求情，才让你得以离开险恶的宫城。","后来你在南方开起一间小茶舍，总有人愿意与你说心事。你依旧相信人，但学会了先看行动，再付真心。"],"strengths":"有同理心、愿意倾听，容易让陌生人卸下防备。","shadow":"会把理解别人的难处误当成对方值得信赖的证明。","counsel":"信任不必收回，但可以分阶段交付。真正可靠的人，经得起时间验证。","quotes":["不是所有握住的手，都能一起走到最后。","我依然相信人，只是不再盲信。","温柔不是没有边界。"]},{"id":"social_middle","role":"social","tier":"middle","episode":42,"name":"四方游说者","title":"你赢得了更自由的江湖","coverQuote":"你没有赢得整座朝堂，却赢得了值得信赖的人。","story":["第四十二集，你用耐心与诚意促成数位官员共同作证，让粮案终于有了结果。","有人邀你留下争一席高位，你却想到那些在灾年中等待消息的百姓。你自请行走州县，为流民和地方官搭起沟通的桥。","多年以后，驿站里仍有人说起那位总能把对立的人请到同一张桌前的使者。"],"strengths":"耐心沟通、协调分歧、照顾不同人的情绪和处境。","shadow":"容易为了维持和气而延后必要的冲突。","counsel":"善意的协调不意味着总要折中；当原则受到挑战时，可以坚定地说不。","quotes":["最远的路，是从你的心走到我的心。","不必人人同路，但愿彼此有归途。","有些难关，是一起走过的。"]},{"id":"social_legend","role":"social","tier":"legend","episode":86,"name":"朝堂调停者","title":"人人愿意站出来的那一日","coverQuote":"你最强大的武器，从来不是权力，而是人心。","story":["第八十六集，粮案审理早已过去多年，新旧势力之间又起争执。","你不曾握有最锋利的权柄，却能请来曾经互相敌视的官员，让众人先看见共同要守护的事。那天殿上没有惊天一吼，只有一份份被人郑重签下的承诺。","史官为你写下一句评语：以诚聚众，以信成事。你知道，这比任何封赏都珍贵。"],"strengths":"共情敏锐、善于结盟，让分散的人愿意为共同目标行动。","shadow":"把太多精力放在照顾所有人的感受上，容易忽略自己的真实需要。","counsel":"好的关系既需要理解别人，也需要把自己的边界说清楚。","quotes":["人心不是棋子，是灯火。","我不靠威势服众，只盼同心。","让不同的人，守同一个承诺。"]},{"id":"courage_early","role":"courage","tier":"early","episode":10,"name":"锋芒早露者","title":"这把剑，出鞘得太早","coverQuote":"你的勇敢无人能及，只是这一局，出剑太早。","story":["第十集，面对朝堂之上的诬陷，你第一个站出来反驳，甚至不惜在众人面前揭开幕后之人的名字。","可你还缺少能够站稳脚跟的证据。对方没有与你争辩，只利用一道调令让你离京。","你后来成为边城百姓最爱提起的侠义之人：走得太快，跌过一跤，却从未失去继续前进的胆量。"],"strengths":"行动果断、勇于面对冲突、在他人犹豫时能够率先迈步。","shadow":"容易把立即行动视为唯一的勇敢，忽视准备和节奏。","counsel":"真正的胆识不是每次都冲在最前，而是知道何时把力量留给关键一击。","quotes":["剑出太早，江湖还长。","我输的是时机，不是胆量。","一身锋芒，也要学会藏光。"]},{"id":"courage_middle","role":"courage","tier":"middle","episode":35,"name":"仗剑离朝客","title":"走出宫门，天地才刚刚开始","coverQuote":"困住你的从来不是强敌，而是那座太小的朝堂。","story":["第三十五集，你一连几次在险境中果断行动，终于为赈粮案争得转机。","然而，当朝堂开始围绕封赏与官位争执时，你忽然厌倦了这一切。你卸下官服，背起行囊走向边关。","那年秋天，驿道上多了一位行踪不定的游侠。有不平处便有你的身影，有人问你为何不求高官，你答：江湖比宫门宽多了。"],"strengths":"有行动力、重自由、敢于为真实想法改变方向。","shadow":"不喜欢束缚时，可能低估长期坚持的价值。","counsel":"自由与责任并不冲突；选定值得守护的方向，也是一种勇敢。","quotes":["宫门之外，才是山河。","我的官职？江湖闲人。","路远天高，我自去也。"]},{"id":"courage_legend","role":"courage","tier":"legend","episode":90,"name":"逆局开拓者","title":"第九十集，绝境里开出新路","coverQuote":"当所有人都在等待答案时，你已经开始改变问题。","story":["第九十集，朝中又遇一场天灾，旧有制度迟迟无法让粮食及时送到百姓手中。","你不愿只在殿上争论，把此前赈粮案揭露的漏洞一一化成新办法：沿途登记、临时调度、公开核对。有人说你太冒险，但事实很快给出了回应。","后来史书没有详写你的官阶，只记住那一年千里道路上的炊烟，又一次升了起来。"],"strengths":"果敢、开拓、敢在不确定性中承担行动责任。","shadow":"冲锋太快时可能遗漏同伴的顾虑与执行成本。","counsel":"把勇气和反馈结合起来：先行动、小步验证，再带更多人一起走。","quotes":["既无路，便开路。","等风来的人很多，起身的人很少。","不是天命不可改，是
